name: Publish Release

on:
  push:
    tags:
      - app-v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:check

      - name: Compute version and tag
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="app-v$VERSION"

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag/version mismatch: pushed tag '$TAG' but package version expects '$EXPECTED_TAG'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=Projects Runner v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs_on: windows-latest
            tauri_args: --bundles nsis
          - platform: linux
            runs_on: ubuntu-22.04
            tauri_args: --bundles appimage,deb
          - platform: macos
            runs_on: macos-26
            tauri_args: --target aarch64-apple-darwin --bundles dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        if: matrix.platform != 'macos'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust with macOS target
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libxss-dev \
            libdbus-1-dev \
            pkg-config \
            libclang-dev \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxrandr-dev \
            libwayland-dev \
            libegl-dev \
            libx11-dev \
            libxtst-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Verify TypeScript bindings
        run: npm run bindings:check

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        if: matrix.platform != 'macos' || runner.arch == 'arm64'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate release metadata
        run: npm run release:check

      - name: Build release bundles
        shell: bash
        run: npm run release:build -- ${{ matrix.tauri_args }}

      - name: Collect release artifacts
        run: npm run release:artifacts -- ${{ matrix.platform }} release-artifacts/${{ matrix.platform }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: release-artifacts/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create SHA-256 checksums
        run: node ./scripts/create-release-checksums.mjs release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.dmg
            release-artifacts/SHA256SUMS.txt
